<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>管理者設定</title>
<link rel="stylesheet" href="setting.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
<script type="module" src="setting.js"></script>
<link rel="icon" href="icons/Tokyo_AIfavicon.png" type="image/x-icon">
</head>

<body>

<header class="topbar">
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <h1>管理者画面</h1>
    <div class="topbar-right">
        <div id="headerClock" class="header-clock"></div>
    <div class="profile">
        <button id="profileBtn" class="profile-btn">👤</button>
        <div id="profileMenu" class="profile-menu">
            <div class="profile-name" id="profileName"></div>
            <hr>
            <button id="logoutBtn" class="logout-btn">ログアウト</button>
        </div>
    </div>
</header>

<nav id="sidebar" class="sidebar open">
    <a href="home.html" title="家">
        <img src="icons/home.png">
    </a>
    <a href="list.html" title="座席表管理">
        <img src="icons/char.png">
    </a>
    <a href="chat.html" title="チャット">
        <img id="chatIcon" src="icons/chat.png">
    </a>
    <a href="manage.html" title="当日名簿">
        <img src="icons/Registrant_list.png">
    </a>

    <a href="arrangement.html" title="配置図">
        <img src="icons/arrangement.png">
    </a>

    <a href="roulette.html" title="ルーレット">
        <img src="icons/roulette.png">
    </a>
</nav>

<div id="page" class="page shift">

<div class="container">

<!-- 管理者管理 -->
<div class="setting-box">
    <h3>管理者管理</h3>

    <select id="adminSelect">
        <option>読み込み中...</option>
    </select>

    <button id="removeAdminBtn" class="danger">
        選択した管理者を削除
    </button>

    <br><br>

    <input
        type="email"
        id="newAdminEmail"
        placeholder="追加するメールアドレス"
    >

    <button id="addAdminBtn">
        管理者追加
    </button>
</div>

<hr>

<!-- バックアップ管理 -->
<div class="setting-box">

    <h3>バックアップ管理</h3>

    <button id="backupBtn">
        バックアップ作成
    </button>

    <br><br>

    <input
        type="file"
        id="restoreFile"
        accept=".json"
    >

    <button id="restoreBtn">
        バックアップ復元
    </button>

</div>

<script type="module" src="settingGuard.js"></script>
<script type="module" src="layout.js"></script>
<script>
/* メニュー開閉用（グローバル） */
window.toggleMenu = function(){
    const sidebar = document.getElementById("sidebar");
    const page = document.getElementById("page");
    sidebar.classList.toggle("close");
    page.classList.toggle("shift");
};
</script>

</body>
</html>
