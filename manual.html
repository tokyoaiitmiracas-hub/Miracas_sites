<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webマニュアル</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }

    /* サイドバー */
    .sidebar {
      width: 250px;
      background: #1e1e2f;
      color: white;
      height: 100vh;
      overflow-y: auto;
      padding: 20px;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .sidebar a {
      display: block;
      color: #ccc;
      text-decoration: none;
      margin: 8px 0;
    }

    .sidebar a:hover {
      color: white;
    }

    /* メイン */
    .content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      height: 100vh;
    }

    section {
      margin-bottom: 60px;
    }

    h1 {
      border-bottom: 2px solid #ddd;
      padding-bottom: 5px;
    }

    pre {
      background: #f4f4f4;
      padding: 10px;
      overflow-x: auto;
    }

    .search-box {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: none;
      border-radius: 5px;
    }

  </style>
</head>
<body>

  <div class="sidebar">
    <input type="text" class="search-box" placeholder="検索..." onkeyup="searchMenu(this.value)">

    <h2>目次</h2>
    <a href="#intro">はじめに</a>
    <a href="#setup">環境構築</a>
    <a href="#git">Git操作</a>
    <a href="#deploy">デプロイ</a>
  </div>

  <div class="content">

    <section id="intro">
      <h1>はじめに</h1>
      <p>このマニュアルでは、開発環境の構築からデプロイまでを解説します。</p>
    </section>

    <section id="setup">
      <h1>環境構築</h1>
      <p>以下の手順で環境を構築します。</p>
      <pre>
npm install
      </pre>
    </section>

    <section id="git">
      <h1>Git操作</h1>
      <pre>
git init
git add .
git commit -m "first commit"
      </pre>
    </section>

    <section id="deploy">
      <h1>デプロイ</h1>
      <p>以下のコマンドでデプロイします。</p>
      <pre>
firebase deploy
      </pre>
    </section>

  </div>

  <script>
    function searchMenu(keyword) {
      const links = document.querySelectorAll('.sidebar a');
      links.forEach(link => {
        if (link.textContent.includes(keyword)) {
          link.style.display = 'block';
        } else {
          link.style.display = 'none';
        }
      });
    }
  </script>

</body>
</html>
