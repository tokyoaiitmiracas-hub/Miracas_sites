<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM FAILURE</title>
    <style>
        body {
            background-color: #000;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .container {
            max-width: 600px;
            border: 2px solid #ff3333;
            padding: 40px;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.3);
            background-color: rgba(20, 0, 0, 0.9);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff3333;
            animation: blink 1s infinite;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .code {
            color: #888;
            margin-top: 30px;
            font-size: 0.9rem;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SYSTEM FAILURE</h1>
        <p>すべてのネットワーク接続が遮断されました。</p>
        <p>システムの復旧は不可能です。</p>
        <p>今までご利用いただき、ありがとうございました。</p>
        
        <div class="code">
            <p>ERROR CODE: 0xFF-SHUTDOWN-99</p>
            <p>TERMINATING ALL PROCESSES...</p>
        </div>
    </div>
</body>
</html>
